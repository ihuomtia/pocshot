[workspace]
members = [
    "crates/pocshot",
    "crates/pocshot-core",
    "crates/pocshot-gui",
    "crates/pocshot-ocr",
    "crates/pocshot-snap",
    "crates/pocshot-tray",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.32"
egui-phosphor = { version = "0.10", features = ["regular", "fill"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.27"
log = "0.4"
ocrs = "0.12"
rten = "0.24"
rten-imageproc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tray-menu = { version = "0.1.2", default-features = false }
ureq = "2"
xcap = "0.9.8"

# Optimize the ML runtime family in debug builds. rten's matmul/conv kernels
# (rten-gemm, rten-simd, rten-tensor, …) are pathologically slow at
# opt-level 0; the ocrs README mandates building rten and its dependencies
# optimized. Only these crates get opt-level 3 so OCR is usable in debug while
# the UI deps (eframe/wgpu/…) keep compiling fast.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
