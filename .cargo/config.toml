# Cross-compilation support.
#
# x86_64-pc-windows-gnu uses the mingw-w64 toolchain. On Arch install
# `mingw-w64-gcc` (base-devel/openmp variants optional) and add the target with
# `rustup target add x86_64-pc-windows-gnu`. Build with:
#   cargo build --release --target x86_64-pc-windows-gnu -p pocshot
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"