[package]
name = "pocshot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pocshot"
path = "src/main.rs"

[features]
# Both renderers compiled in: one binary that prefers OpenGL and falls back to
# wgpu + a CPU adapter on machines without it (RDP, GPU-less VMs).
default = ["gpu", "software"]
# Hardware rendering (the normal path).
gpu = ["pocshot-gui/gpu"]
# Software-rendering build (`pocshot-soft`): wgpu + a CPU adapter, for machines
# without a usable GPU/OpenGL (RDP, GPU-less VMs).
software = ["pocshot-gui/software"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
image.workspace = true
log.workspace = true
pocshot-core = { path = "../pocshot-core" }
pocshot-gui = { path = "../pocshot-gui", default-features = false }
pocshot-ocr = { path = "../pocshot-ocr" }
pocshot-tray = { path = "../pocshot-tray" }
serde_json.workspace = true
