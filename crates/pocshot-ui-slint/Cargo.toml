[package]
name = "pocshot-ui-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
image.workspace = true
log.workspace = true
pocshot-core = { path = "../pocshot-core" }
pocshot-annotate = { path = "../pocshot-annotate" }
pocshot-config = { path = "../pocshot-config" }
pocshot-ocr = { path = "../pocshot-ocr" }
pocshot-snap = { path = "../pocshot-snap" }
slint.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
slint-build.workspace = true
